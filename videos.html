<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" type="text/css" href="css/style.css">
  <title>Vídeos | David Adventury</title>
  <link rel="stylesheet" href="estilo-videos.css" />
  <style>
    /* Estilo básico para a galeria de fotos */
    .fotos-section {
      padding: 50px 20px;
      background-color: #111;
      color: #fff;
      text-align: center;
    }

    .fotos-section h1 {
      margin-bottom: 30px;
      font-size: 2em;
    }

    .galeria-fotos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .foto-card img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.7);
      transition: transform 0.3s ease;
    }

    .foto-card img:hover {
      transform: scale(1.05);
    }

    .foto-caption {
      margin-top: 10px;
      font-size: 1rem;
      color: #ccc;
    }
  </style>
</head>
<body>
  <main class="videos-section">
    <h1 class="titulo">Vídeos de David Adventury</h1>
    
    <div class="grade-videos">
      <div class="video-card">
        <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="Gameplay 1" frameborder="0" allowfullscreen></iframe>
        <h2 class="video-title">Primeira aventura épica</h2>
      </div>
      
      <div class="video-card">
        <iframe src="https://www.youtube.com/embed/3fumBcKC6RE" title="Gameplay 2" frameborder="0" allowfullscreen></iframe>
        <h2 class="video-title">Missão secreta completa!</h2>
      </div>
      
      <div class="video-card">
        <iframe src="https://www.youtube.com/embed/tgbNymZ7vqY" title="Gameplay 3" frameborder="0" allowfullscreen></iframe>
        <h2 class="video-title">Batalha contra o chefão</h2>
      </div>
    </div>
  </main>

  <!-- Seção de Fotos -->
  <section class="fotos-section">
    <h1>Jogos em que estou Aventurando</h1>
    <div class="galeria-fotos">
      <div class="foto-card">
        <img src="inicio/DAspawner1.jpg" alt="MineCraft inicio ">
        <div class="foto-caption">Explorando as ruínas antigas</div>
      </div>
      <div class="foto-card">
        <img src="imagens/jogo2.jpg" alt="Jogo 2">
        <div class="foto-caption">Combate em terreno nevado</div>
      </div>
      <div class="foto-card">
        <img src="imagens/jogo3.jpg" alt="Jogo 3">
        <div class="foto-caption">Missão noturna no deserto</div>
      </div>
    </div>
  </section>
</body>
</html>
